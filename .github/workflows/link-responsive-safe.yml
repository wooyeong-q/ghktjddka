name: Link responsive safe stylesheets

on:
  push:
    paths:
      - '.github/workflows/link-responsive-safe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Link responsive stylesheets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          links = [
              '  <link rel="stylesheet" href="./responsive-safe.css?v=20260716-1" />\n',
              '  <link rel="stylesheet" href="./popup-mobile-fix.css?v=20260716-2" />\n',
          ]

          changed = False
          for link in links:
              filename = link.split('./', 1)[1].split('?', 1)[0]
              if filename not in text:
                  text = text.replace('</head>', link + '</head>', 1)
                  changed = True

          if changed:
              path.write_text(text, encoding='utf-8')
              print('Responsive stylesheets linked.')
          else:
              print('Responsive stylesheets already linked; deployment refresh only.')
          PY

      - name: Commit index update
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '화성암 냉각 팝업 모바일 보정 스타일 연결'
          git push
