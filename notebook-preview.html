<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>화면 크기 확인</title>
<style>body{margin:0;background:#07131e;color:#e7f4f6;font:16px system-ui,sans-serif;overflow:hidden}header{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px}button{background:#244858;border:1px solid #6b9cad;color:#f1f7f8;border-radius:6px;padding:6px 12px;font:inherit}main{position:relative;width:calc(100vw - 16px);height:calc(100dvh - 64px);margin:8px}iframe{display:block;position:absolute;top:0;left:50%;transform-origin:top center;border:0;outline:1px solid #587c8f}</style>
<header><strong>화면 크기 확인</strong><button data-width="1920" data-height="900">1920 × 900</button><button data-width="1366" data-height="640">1366 × 640</button><button data-width="1024" data-height="580">1024 × 580</button><button data-src="./index.html">미리보기</button><button data-src="https://ghktjddka.vercel.app/">운영 화면</button></header>
<main><iframe src="./index.html" title="화성암 실험실"></iframe></main>
<script>let w=1920,h=900;const frame=document.querySelector('iframe');function fit(){const scale=Math.min(1,(innerWidth-16)/w,(innerHeight-64)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='translateX(-50%) scale('+scale+')';}document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.src){frame.src=button.dataset.src;return;}w=Number(button.dataset.width);h=Number(button.dataset.height);fit();}));addEventListener('resize',fit);fit();</script></html>
